name: build

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: temurin

  - name: Build mod
    run: |
      unzip -q grade-mod.zip -d project
      cd project
      gradle build

  - uses: actions/upload-artifact@v4
    with:
      name: grade-mod
      path: project/build/libs/*.jar
