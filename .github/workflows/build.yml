name: build
on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04
steps:
- uses: actions/checkout@v6
- name: unpack project
run: |
test -f skooldlc-project.zip
mkdir work
unzip -q skooldlc-project.zip -d work
- uses: actions/setup-java@v5
with:
java-version: '25'
distribution: 'microsoft'
- uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '9.1.0'
- name: build
working-directory: work
run: gradle build
- name: list jars
run: ls -la work/build/libs
- uses: actions/upload-artifact@v7
with:
name: skooldlc-jar
path: |
work/build/libs/.jar
!work/build/libs/-sources.jar
if-no-files-found: error
