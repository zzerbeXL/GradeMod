name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: unpack project
        run: |
          test -f grade-mod.zip
          mkdir work
          unzip -q grade-mod.zip -d work
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        working-directory: work
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: list jars
        run: ls -la work/build/libs
      - uses: actions/upload-artifact@v7
        with:
          name: grade-mod
          path: |
            work/build/libs/*.jar
            !work/build/libs/*-sources.jar
          if-no-files-found: error
