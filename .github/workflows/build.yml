name: build

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Unpack project
    run: |
      mkdir work
      unzip -q grade-mod.zip -d work

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      java-version: '25'
      distribution: microsoft

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '9.1.0'

  - name: Build
    working-directory: work
    run: gradle build

  - name: Upload mod
    uses: actions/upload-artifact@v4
    with:
      name: grade-mod
      path: work/build/libs/*.jar
      if-no-files-found: error
